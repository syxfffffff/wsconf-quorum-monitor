
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Quorum Status</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #222222;
  }

  .card {
    width: 100%;
    min-height: 145px;
    background: #ffffff;
    padding: 16px 18px;
  }

  .title {
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    margin: 0;
  }

  .result {
    text-align: center;
    font-size: 52px;
    font-weight: 700;
    line-height: 1.2;
    margin-top: 12px;
  }

  .yes {
    color: #16a34a;
  }

  .no {
    color: #dc2626;
  }

  .count {
    text-align: center;
    font-size: 13px;
    color: #777777;
    margin-top: 4px;
  }
</style>
</head>

<body>
  <div class="card">
    <div class="title">Has quorum been met?</div>
    <div id="result" class="result">—</div>
    <div id="count" class="count">
      Checking votes...
    </div>
  </div>

<script>
async function updateQuorum() {
  const result = document.getElementById("result");
  const count = document.getElementById("count");

  try {
    const response = await fetch(
      "quorum.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to retrieve data");
    }

    const data = await response.json();

    result.textContent = data.quorum_met ? "YES" : "NO";
    result.className =
      "result " + (data.quorum_met ? "yes" : "no");

    count.textContent =
      data.votes_received +
      " of " +
      data.quorum_required +
      " votes received";

  } catch (error) {
    result.textContent = "—";
    result.className = "result";
    count.textContent = "Data unavailable";
  }
}

updateQuorum();
setInterval(updateQuorum, 60000);
</script>
</body>
</html>
